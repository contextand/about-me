<style>
  :root {
    --margin: 20px;
    --gutter: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: "Wanted Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.8;
    word-break: break-word;
  }

  .page {
    min-height: 100vh;
    padding: 15px 20px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  #bg-container {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* 화면 전체를 덮는 색 판. 글 상자 자리만 구멍이 뚫려 있다. */
  .background-layer {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: var(--gutter);
    position: relative;
    z-index: 1;
  }

  /* 위 뭉치는 위로 붙고, 아래 뭉치는 아래로 붙는다.
     컬럼마다 글 길이가 달라서 생기는 들쭉날쭉한 경계가 가운데 빈 공간의 형태를 만든다. */
  .top { align-items: start; }
  .bottom { align-items: end; }

  /* 빈 공간. 위아래 뭉치가 쓰고 남은 높이를 전부 가져간다.
     본문과 같은 12컬럼 위에, 높이를 6등분한 줄을 얹어 소개 네 조각을 흩는다. */
  .void {
    flex: 1 0 140px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(6, 1fr);
    column-gap: var(--gutter);
    align-items: start;
    position: relative;
    z-index: 1;
  }

  .col p { margin: 0; }
  .col:hover { text-decoration: underline; }

  .id-item { color: inherit; text-decoration: none; display: block; }
  .id-item[href]:hover { text-decoration: underline; }

  /* 좁아지면 컬럼이 좁아져 글이 길게 늘어나 한 화면을 넘긴다. 한 단계만 줄인다. */
  @media (max-width: 1399px) {
    body { font-size: 12px; }
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .col { grid-column: 1 !important; margin-bottom: 1.8em; }
    .bottom { align-items: start; }
    /* 좁은 화면에서는 흩지 않고 차례대로 쌓는다. */
    .void { flex: 0 0 auto; display: block; margin: 10vh 0; }
  }

  <p>현재 내가 지향하는 일 태도는 '할 수 있는 일을 할 수 있는 만큼, 무리하지 말고, 너무 바쁘지 않게'다. 어찌 보면 기본소득을 받아야 가능할 수 있는 이 태도를 지금 해보고 있는데, 이건 소득만으로 해결되는 문제는 아닌 것 같다. 사람마다 다르겠지만 나는 회사라는 조직 안에서 이를 실현하기 어려워 프리랜서가 되었고, 프리랜서만 해서는 무리할 수밖에 없어서 다른 알바도 병행하고 있다. 여기에 한 가지 더 필요한 건 마음이다. 돈을 많이 벌지 않겠다는 마음..(농담이 아니다) 알바를 통한 고정비가 나에게 기본소득처럼 작용하고 있고, 그렇게 생긴 여유로 프리랜서 디자이너 일을 큰 부침 없이 하고 있다. 저 원칙을 지키려고 종종 밥줄 끊어지는 선택을 하고 있지만 아직까지는 괜찮다.</p>

  <p>글을 쓸 때 퇴고를 여러 번 하는 것 처럼, 내가 한 일은 보면 볼수록 더 나아질 구석이 보이기 마련이다. 이건 디자인도 마찬가지여서, 한 번에 디자인을 끝내기보다는 여러 번 다시 보며 생각을 덧대는 것이 좋다. (물론 시간적 여유가 있어야 함) 디자인을 시간당 인건비로 계산한다면 3시간짜리 일을 하루 만에 끝내기보다는 한 시간씩 3일 동안 하는 것이 작업의 퀄리티나 스스로의 만족도 차원에서 좋다.</p>

  <p>주에 4일은 공유오피스로 출근한다. 회사를 다니는 직장인처럼 이른 아침 첫차를 타고 출근길에 오른다. 나는 출근감(출근하는 감각)이라고 부르는데, 독립적으로 일하더라도 출근감을 유지하려고 애쓰는 편이다. 아침 일찍 나와 자리에 앉는 것, 어떤 부지런을 떠는 것이, 일을 위한 나름의 준비동작이 된 듯하다. 주 4일을 월화-목금, 월-수목금, 월화수-금 등 다양하게 시도해 보았는데 개인적으론 월화-목금이 가장 좋았다. 하루는 오랜만에 일하는 재미로, 남은 하루는 오늘까지만 힘내자는 마음으로 보낼 수 있다. 월금월금의 느낌이랄까. 주 4일제가 도입되고 수요일이 휴무가 된다면 월요병도 사라지고 모두가 조금 더 즐겁게 일할 것 같다.</p>

  <p>디자인이 가능하냐는 질문을 종종 받는다. 회사를 다니지 않는, 그렇다고 대놓고 프리랜서도 아닌, 작업 분야나 별다른 견적표도 없는 내게 관심을 주는 고마운 사람들. 여러 조건을 따져보지만 속으론 이렇게 생각한다. 그럼요. 무엇이든 가능합니다. 문제는 당신의 마음이죠. 작업의 맥락과 시간이 주어진다면 나라는 필터를 거친 시각적 결과를 보여줄 수 있다. 문제는 그것을 당신이 쓸지 안 쓸지다. 디자인이 마음에 들지 않는다면 쓰지 않아도 되고 비용을 주지 않아도 된다. 일을 하고 돈을 받지 않는 것은 괜찮다. 내가 디자인으로 상대를 설득하지 못해서 상대의 설득대로 디자인하는 일은 피하고 싶다. 어찌 되었든 신뢰가 중요하다. 나를 믿는가. 나를 믿을 만한 과정과 결과를 보여주었는가. 그럴 수 있는 관계인가를 고민한다.</p>

  <p>업무는 일을 마칠 때가 아니라 내가 한 일을 알릴 때 끝나는 거라고 했다. 회사에 속하지 않은 사람이라면 더더욱 그렇다. 내가 무슨 일을 하는지 사람들이 알아야 관련된 일이 꼬리를 물고 찾아오기 마련이다. 그런 맥락에서 SNS는 도파민 중독을 감내하더라도 꼭 활용해야 하는 도구다. 나는 블로그와 페이스북, 인스타그램을 하고 있지만 SNS를 그렇게 잘 활용하는 것 같진 않다. 정확히는 네트워킹, 연결의 목적으로 말이다. 내가 사용하는 서비스는 SNS 가 아닌 SAS(Social Archive Service)에 가깝다. 연결된다 보다는 기록한다는 마음으로 무언가를 올리고, 콘텐츠의 노출보다는 꾸준한 기록에 초점을 맞춘다. 가끔은 이런 기록이 어떤 연결을 만들기도 한다.</p>

  <p>그만해야 할 때 그만두는 것을 응원하는 편이다. 그만두는 이유가 딱히 궁금하지도 않다. 예의상 이유를 묻기도 하지만 그 사람만의 고민이 있을 것이고 이를 오롯이 말로 전하긴 어려울 것이다. 최근 소통하던 실무자 분이 마음을 돌보고자 직을 그만두게 되었다며 송구하다는 메일을 보냈다. 아쉬움보다는 응원하고 싶은 마음이 먼저 들었고 그만두는 마음을 응원한다고 답장을 보냈다.</p>

  <p>디자인 초안. 디자인을 의뢰한 클라이언트에게 처음 보여주는 시안. 완성본이 아닌 초기 컨셉을 보여주며 방향성을 확인하는 용도지만 그 중요성은 완성본 못지않다. 디자인 초안은 첫인상과 같아서 상대에서 신뢰 혹은 불안을 줄 수 있다. 전적인 믿음까지는 아니라도 처음부터 별로라는 인상을 준다면 이후의 작업 과정도 순탄치 않을 가능성이 높다. 때문에 디자인 초안에서부터 정확한 메시지를 전달해야 한다. 내가 이 작업에 최선을 다하고 있고, 이 정도의 디자인을 할 수 있다는 것을.. 그럼에도 신뢰를 얻지 못한다면 어쩔 수 없다.</p>

  <p>어떤 대답은 모르는 것을 물어볼 수 없게, 모르는 채로 두게 한다. 여러 이유가 있겠지만 대답의 온도 때문인 경우가 종종 있다. 같은 의도의 말이라도 유독 날 선 말들. 누군가와 함께 일한다면 모르는 것을 물어볼 수 있는 관계를 잘 유지해야 한다. 혼내고 혼나는 관계가 되면 물어볼 수 없다.</p>

  <p>디자인 수정사항은 맥락을 함께 전달하는 게 좋다. '여기 글씨를 더 크게 해주세요' 라는 요청보다는 '대상이 연령대가 있으니, 글씨가 더 잘 보이면 좋겠습니다. 디자인을 해치지 않는 선에서 가장 잘 보이게 부탁드려요.'와 같은 제안이 좋다. 별 다른 이유가 없어도 디자이너는 요청 너머의 맥락을 생각하지만, 가끔 이 생각을 멈추게 하는 경우가 있다. 맥락 없는 소통을 하고 있다면, 그리 좋은 협업 관계는 아니다.</p>

  <p>일 제안을 받게 되면 작업범위, 견적비용, 작업기간, 소통방식등을 정리해서 제안한다. 나는 이런 방식으로 일하고, 이 정도 범위의 일을 이 기간 동안 이 비용으로 진행할 수 있는데 괜찮은지 묻는다. 개 중에 가장 중요한 요소를 꼽자면 소통 방식인데, 내가 제안하는 것은 매번 비슷하다. '어느 정도 권한이 있는 담당자 1인과 이메일로 소통합니다.' 어느 정도 권한이 있다는 말은 조직 내부의 다양한 의견을 본인 선에서 정리할 수 있다는 말이다. 어떤 결정권자가 있어서 그 사람의 말을 전달만 하는 중간 담당자와 소통하고 싶지 않다는 의미이고 직원을 그런 수동적인 역할로 부리는 조직과는 일하고 싶지 않다는 말이기도 하다. 이메일을 사용하는 이유는 기록이 잘 남고, 한번 더 정제된 생각을 주고받고, 즉답을 하지 않는 비동기 방식의 소통이 가능하기 때문이다.</p>

  <p>일에서 가장 중요한 것은 관계다. 너와 내가 서로를 얼마나 이해하고 예상하는지, 그래서 얼마큼 믿고 있는지. 그런 것들이 중요하다. 상대의 기대를 파악하는 것만큼 나의 기대를 상대에게 알려주는 것도 중요하고.. 그런 과정 속에서 서로의 생각과 행동을 계속 맞춰나가는 것이 중요하다.</p>

<script>
// 12컬럼을 2와 4로 쪼갠 조합을 하나 만든다. 2:2:4:2:2, 2:4:2:4, 4:4:2:2 ...
// 2만 있거나 4만 있는 밋밋한 조합은 다시 뽑는다.
function composition() {
  let parts;
  for (let tries = 0; tries < 20; tries++) {
    parts = [];
    let left = 12;
    while (left > 0) {
      const size = left >= 4 && Math.random() < 0.5 ? 4 : 2;
      parts.push(size);
      left -= size;
    }
    if (parts.includes(2) && parts.includes(4)) break;
  }
  return parts;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const texts = [...document.getElementById('texts').content.querySelectorAll('p')]
  .map(p => p.innerHTML);

const topEl = document.getElementById('top');
const bottomEl = document.getElementById('bottom');

const BODY_FONT = '"Wanted Sans"';

// 컬럼 하나에 글 하나. 2와 4를 섞은 조합은 언제나 4칸 아니면 5칸이라
// 위아래 합쳐 8~10편이 뽑힌다.
function candidate() {
  const slots = [
    ...composition().map(span => ({ span, host: topEl })),
    ...composition().map(span => ({ span, host: bottomEl }))
  ];

  // 어느 글이 어느 폭에 앉을지는 정하지 않는다.
  // 긴 글이 좁은 컬럼에 걸려 길게 뻗는 것이 들쭉날쭉한 경계를 만든다.
  shuffle([...texts]).slice(0, slots.length)
    .forEach((text, i) => { slots[i].text = text; });

  return { slots, identity: scatter() };
}

// 소개 네 조각의 자리. 두 칸짜리 넷을 12칸에 놓고 남는 네 칸을
// 다섯 틈에 무작위로 나눈다. 가로로 겹칠 일이 없다.
// 줄은 여백을 6등분한 것 중 가운데 넷(2~5)에서만 고른다. 조각마다 따로 정한다.
// 맨 위아래 줄을 비워 두어야 소개가 단락에 바로 붙어 문장의 일부처럼 읽히지 않는다.
function scatter() {
  const gaps = [0, 0, 0, 0, 0];
  for (let i = 0; i < 4; i++) gaps[Math.floor(Math.random() * 5)]++;

  const places = [];
  let column = 1;
  for (let i = 0; i < 4; i++) {
    column += gaps[i];
    places.push({ column, row: 2 + Math.floor(Math.random() * 4) });
    column += 2;
  }
  return places;
}

const idItems = [...document.querySelectorAll('.id-item')];

const SVG_NS = 'http://www.w3.org/2000/svg';
// 글 상자보다 이만큼 넉넉하게 뚫는다.
const HOLE_PAD = 20;
let layerCount = 0;

// 판 색. 화면마다 한 칸씩 순서대로 옮겨간다.
// 무작위로 뽑으면 같은 색이 연달아 나와 판이 얹힌 게 안 보이는 화면이 생긴다.
const SHEET_COLORS = ['#ffde59', '#5ce1e6', '#c1ff72', '#e2a9f1', '#ff8282', '#d9d9d9'];
let colorIndex = 0;
// 되돌릴 때 쓸 예전 방식: 'rgba(0, 0, 0, 0.02)' 한 색으로만 칠했고,
// 반투명이라 겹칠수록 짙어졌다. sheetColor()가 이 값을 늘 돌려주게만 하면 된다.
function sheetColor() {
  return SHEET_COLORS[colorIndex++ % SHEET_COLORS.length];
}

function svgRect(x, y, width, height, fill) {
  const el = document.createElementNS(SVG_NS, 'rect');
  el.setAttribute('x', x);
  el.setAttribute('y', y);
  el.setAttribute('width', width);
  el.setAttribute('height', height);
  el.setAttribute('fill', fill);
  return el;
}

// 화면 전체를 덮는 색 판을 한 장 얹는다. 글이 놓인 자리는 뚫어 둔다.
// 불투명하므로 색이 섞이지는 않고, 뚫린 구멍으로 앞선 판들이 차례로 들여다보인다.
function addBackgroundLayer() {
  const pageRect = document.querySelector('.page').getBoundingClientRect();
  const width = pageRect.width;
  const height = pageRect.height;
  const maskId = 'holes-' + layerCount++;

  // 구멍끼리 겹칠 만큼 넉넉하게 뚫으므로, 겹쳐도 그냥 합쳐지는 마스크를 쓴다.
  const mask = document.createElementNS(SVG_NS, 'mask');
  mask.setAttribute('id', maskId);
  mask.appendChild(svgRect(0, 0, width, height, '#fff'));

  for (const el of document.querySelectorAll('.col')) {
    const r = el.getBoundingClientRect();
    mask.appendChild(svgRect(
      r.left - pageRect.left - HOLE_PAD,
      r.top - pageRect.top - HOLE_PAD,
      r.width + HOLE_PAD * 2,
      r.height + HOLE_PAD * 2,
      '#000'
    ));
  }

  const sheet = svgRect(0, 0, width, height, sheetColor());
  sheet.setAttribute('mask', 'url(#' + maskId + ')');

  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('class', 'background-layer');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.append(mask, sheet);

  document.getElementById('bg-container').appendChild(svg);
}

function render(view) {
  topEl.replaceChildren();
  bottomEl.replaceChildren();
  for (const slot of view.slots) {
    const div = document.createElement('div');
    div.className = 'col';
    div.style.gridColumn = 'span ' + slot.span;
    div.innerHTML = '<p>' + slot.text + '</p>';
    slot.host.appendChild(div);
  }

  view.identity.forEach((place, i) => {
    idItems[i].style.gridColumn = place.column + ' / span 2';
    idItems[i].style.gridRow = place.row;
  });
}

// 폰트가 도착하기 전에 높이를 재면 대체 폰트 기준이라 화면 맞춤이 어긋난다.
// 실제로 쓸 글자까지 넘겨서 필요한 조각을 모두 받아둔다.
async function loadFont() {
  await document.fonts.load('13px ' + BODY_FONT, texts.join('')).catch(() => {});
  await document.fonts.ready;
}

// 글 길이가 매번 달라서 어떤 조합은 한 화면을 넘긴다.
// 여러 번 그려보고 화면에 딱 들어차는 것을 고른다.
// (컬럼이 세로로 쌓이는 좁은 화면에서는 한 화면에 담는 게 불가능하므로 그냥 한 번 그린다.)
function layout() {
  if (matchMedia('(max-width: 900px)').matches) {
    const view = candidate();
    render(view);
    return view;
  }

  const available = innerHeight - 20 * 2;
  const wantedVoid = available * 0.2;
  // 소개 세 줄이 들어가고도 위아래로 숨 쉴 자리가 남아야 한다.
  const minVoid = 140;
  let best = null;

  for (let i = 0; i < 60; i++) {
    const view = candidate();
    render(view);
    const leftover = available
      - topEl.getBoundingClientRect().height
      - bottomEl.getBoundingClientRect().height;
    // 넘치는 조합은 크게 감점하고, 그 중에서도 덜 넘치는 쪽을 남긴다.
    const score = leftover < minVoid
      ? 1e6 + (minVoid - leftover)
      : Math.abs(leftover - wantedVoid);

    if (!best || score < best.score) best = { view, score };
    if (best.score < available * 0.04) break;
  }

  render(best.view);
  addBackgroundLayer();
  return best.view;
}

async function draw() {
  await loadFont();
  return layout();
}

// 지나온 화면을 쌓아둔다. 오른쪽은 다음으로, 왼쪽은 왔던 길로.
const history = [];
let cursor = 0;
let busy = true;

draw().then(view => {
  history.push(view);
  busy = false;
});

addEventListener('keydown', async event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  if (busy) return;

  if (event.key === 'ArrowLeft') {
    if (cursor === 0) return;
    render(history[--cursor]);
    return;
  }

  // 되돌아온 적이 있으면 그때 봤던 것을 다시 보여준다.
  if (cursor + 1 < history.length) {
    render(history[++cursor]);
    return;
  }

  // 처음 가는 화면이면 폰트를 받아온 뒤에 그린다.
  busy = true;
  try {
    history.push(await draw());
    cursor = history.length - 1;
  } finally {
    busy = false;
  }
});
</script>

</body>
</html>
